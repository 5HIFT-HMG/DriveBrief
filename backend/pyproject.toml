[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drivebrief-summary"
version = "0.1.0"
description = "Permission-gated news summarization CLI and local fictional demo API"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.10,<2.12", "fastapi>=0.115,<0.116", "uvicorn>=0.34,<0.35"]

[project.optional-dependencies]
test = ["httpx>=0.27,<0.29"]

[project.scripts]
drivebrief-summary = "drivebrief_summary.cli:main"

[tool.setuptools.packages.find]
include = ["drivebrief_summary*", "drivebrief_api*"]
